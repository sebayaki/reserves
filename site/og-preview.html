        <svg id="og-map" viewBox="0 0 620 370" aria-hidden="true"></svg>

      <footer>
        <span class="footer-note">Public disclosures · Dated snapshots</span>
        <span class="domain">reserves.sebayaki.com <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
